name: CI Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Backend Checks
        run: |
          cd backend
          npm ci
          npm run lint
          # npm test  # Uncomment when tests are ready

      - name: Frontend Checks
        run: |
          cd frontend
          npm ci
          npm run typecheck
          # npm run build  # Verify build succeeds